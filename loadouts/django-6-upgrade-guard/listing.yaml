requires:
  tools:
    - python3
    - uv
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - django6_guard.py
  notes: The scanner only reads .py, .html and .txt files and prints findings; it never edits files and makes no network calls. Running django-upgrade through uvx, or the project with uv, may download the pinned packages.
