id: django-6-upgrade-guard
type: loadout
title: Django 6 guard for removed APIs and django-upgrade
summary: Stop agents writing url(), ugettext, is_ajax(), index_together and CheckConstraint(check=) into Django 6.1 projects, then run django-upgrade and Django's own checks.
description: |
  Agents learnt Django from a decade of answers, so they still write url(), ugettext_lazy, force_text, request.is_ajax(), Meta.index_together and {% load staticfiles %}. All of those are gone, and Django 6.0 and 6.1 removed more: CheckConstraint(check=), positional Model.save() arguments, format_html() with no arguments, finders.find(all=) and the Postgres aggregates' ordering=. Django 6.1 also moves mail settings into MAILERS and adds fetch modes.

  This loadout pairs a short Cursor rule and AGENTS.md (a never/always table and the Django 6 version facts) with a skill that checks the work in three layers. A standard-library Python scanner reports removed APIs as errors and behaviour changes as warnings. django-upgrade rewrites what it safely can. Then manage.py check, makemigrations --check and the tests run with the next two deprecation warnings raised as errors. The verifier runs all of it on a small Django 6.1 shop project and a Django 3-era sample, with the pinned Django 6.1.2 and django-upgrade 1.33.0.
highlights:
  - Never/always table for Django 6.1 in a Cursor rule for .py and templates
  - Scanner flags 17 removed Django APIs as errors, read-only
  - Runs django-upgrade --check at target 6.1 alongside the scanner
  - Tests run with RemovedInDjango70Warning and RemovedInDjango2028Warning as errors
  - Covers 6.1's MAILERS setting and FETCH_RAISE for N+1 queries
