id: mcp-2026-07-28-migration
type: loadout
title: Migrate an MCP server to protocol 2026-07-28
summary: "Move an MCP server to the stateless 2026-07-28 revision on the official SDKs: no sessions or handshake, server/discover, input_required, then a raw stdio probe."
description: |
  MCP revision 2026-07-28 removed the initialize handshake and sessions. Every request now carries its own _meta envelope, and a tool asks the user for input by returning input_required instead of pushing a request mid-call. Upgrading the SDK is not enough on its own: a TypeScript v2 server still speaks 2025 until it is served through serveStdio, and session-keyed state or elicitInput calls survive the official codemod. This loadout gives your agent the changelog as a fix list, plus a scanner for removed patterns and a dependency-free stdio probe. The probe sends server/discover and stateless calls, runs one input_required round trip, and checks -32022 for unknown versions and dual-era fallback. The verifier builds a TypeScript v2 server and probes it alongside a Python SDK 2.3.0 server.
highlights:
  - Changes checked against the official 2026-07-28 changelog and spec pages
  - Scanner for sessions, pushed elicitation and sampling, setLevel, subscribe and v1 wiring
  - "stdio probe: server/discover, resultType, stable tools/list, -32022, dual-era check"
  - input_required round trip in place of elicitInput, with a working TypeScript v2 example
  - "Exact pins: @modelcontextprotocol/server 2.3.1, mcp 2.3.0, go-sdk v1.8.0"
