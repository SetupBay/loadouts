categories:
  - gamedev
  - workflow
stacks:
  - godot
  - gdscript
files:
  - path: AGENTS.md
    role: instructions
    description: Commands, test layout, rules for writing headless tests, and the done checklist.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/godot-headless-tests.mdc
    role: rules
    description: Never/instead table for GDScript test suites under tests/.
  - path: skills/godot-headless-tests/SKILL.md
    role: skill
    skill: godot-headless-tests
    description: Set up the runner, write a suite, lint it, run it headless and report.
  - path: skills/godot-headless-tests/references/run_tests.gd
    role: reference
    skill: godot-headless-tests
    description: The SceneTree test runner to copy to tests/run_tests.gd.
  - path: skills/godot-headless-tests/scripts/gd_test_lint.py
    role: reference
    skill: godot-headless-tests
    description: Read-only linter for test suites that can't fail or that block the run.
  - path: skills/godot-headless-tests/references/bad-test-sample.gd.txt
    role: reference
    skill: godot-headless-tests
    description: A suite with the usual mistakes, for checking the linter.
requires:
  tools:
    - godot-4
    - python3
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: false
  scripts:
    - gd_test_lint.py
    - run_tests.gd
  notes: The linter only reads .gd files and prints findings. The runner only loads the project's own tests/test_*.gd files inside Godot; neither edits files or makes network calls.
