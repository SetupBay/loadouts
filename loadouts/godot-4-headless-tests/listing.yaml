id: godot-4-headless-tests
type: loadout
title: Godot 4 headless GDScript tests
summary: A SceneTree test runner the agent runs with godot --headless after every change, failing on script errors with a non-zero exit, plus a linter for tests that can't fail.
description: |
  godot --headless --check-only tells an agent its script parses. It doesn't tell it that the enemy never dies, that a signal fires twice, or that a node was null halfway through a test. This loadout gives the agent real tests that run in Godot's headless mode, with no editor and no window, in a second or two.

  The runner is one GDScript file that extends SceneTree. It finds tests/test_*.gd, runs every test_*() method with optional before_each and after_each, prints PASS or FAIL per test and quits with exit code 1 on any failure. It hooks Godot's Logger class (4.5 and later), so a script error inside a test, such as calling a method on null, fails that test. Without the hook Godot only prints the error and the test counts as a pass. The rules cover scene tests with real frames, queue_free timing, autoload state that leaks between tests, seeded randomness and the --import step a fresh clone needs before class_name types resolve. A standard-library Python linter flags tests with no check, get_tree() in a suite, OS.delay_msec, an un-awaited frame wait and quit() inside a test.
highlights:
  - One-file SceneTree runner, exit code 1 on any failure, for CI and agents
  - Script errors inside a test fail it, via Godot's Logger hook
  - Scene tests with awaited frames, queue_free timing and autoload resets
  - Linter flags tests that can only pass, blocking delays and un-awaited waits
  - Catches the fresh-clone trap where class_name types are unknown until --import
