  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/write-spec/SKILL.md
    role: skill
    skill: write-spec
    description: Research, interview and write SPEC.md and TASKS.md.
  - path: skills/write-spec/references/spec-template.md
    role: reference
    skill: write-spec
    description: SPEC.md and TASKS.md templates.
  - path: skills/implement-spec/SKILL.md
    role: skill
    skill: implement-spec
    description: Build tickets test-first in waves and review against the spec.
