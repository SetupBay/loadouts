id: spec-first-tickets
type: loadout
title: Spec first, then tickets
summary: "Lightweight spec-driven flow: a SPEC.md with testable acceptance criteria, small tickets, test-first builds in parallel waves and a review against the spec."
description: |
  Spec-driven development was one of the most consistent practices among working developers this autumn, usually in a light
  form: write the spec with the agent, split it into tickets, build each ticket with a test, review against the spec. This
  loadout encodes that flow without a framework: when a spec is needed, what a testable acceptance criterion looks like,
  ticket rules that make parallel work safe, and what to do when the spec turns out to be wrong. It points to Spec Kit and
  OpenSpec for teams that want more.
highlights:
  - When a spec is required and when it is not
  - SPEC.md and TASKS.md templates with testable acceptance criteria
  - "Interview skill: at most five questions at a time, each with a recommended answer"
  - Implementation in dependency waves, test first, one commit per ticket
  - "Spec drift rule: stop and update the spec instead of improvising"
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
