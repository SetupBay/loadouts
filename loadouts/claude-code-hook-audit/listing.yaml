    url: https://code.claude.com/docs/en/hooks
  - title: "Claude Code changelog: 2.1.310 Windows PreToolUse fail-open fix"
    url: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
  - title: "OpenAI Codex docs: Hooks (sources, trust review)"
    url: https://developers.openai.com/codex/hooks
  - title: "Cursor docs: Hooks (failClosed, working directory)"
    url: https://cursor.com/docs/agent/hooks
  - title: "Forever Security: planted AGENTS.md and CLAUDE.md in the Downloads folder (22 Oct 2026)"
    url: https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
  - title: "@DotsonZion: a missing hook script exits 127 and the tool call runs"
    url: https://x.com/DotsonZion/status/2113521676864618893
  - title: "@theomlondhe: update to 2.1.310 if you use PreToolUse guards on Windows"
    url: https://x.com/theomlondhe/status/2114339389325406316
categories:
  - security
  - workflow
stacks:
  - bash
  - python
  - git
files:
  - path: AGENTS.md
    role: instructions
    description: Rules for auditing, changing and proving hooks.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/audit-agent-hooks/SKILL.md
    role: skill
    skill: audit-agent-hooks
    description: Run the audit, read the scripts, propose fixes and prove each guard.
  - path: skills/audit-agent-hooks/scripts/audit_hooks.py
    role: reference
    skill: audit-agent-hooks
    description: Read-only hook and settings audit (Python standard library).
  - path: skills/audit-agent-hooks/references/what-runs.md
    role: reference
    skill: audit-agent-hooks
    description: How Claude Code, Codex and Cursor load, trust and fail hooks.
requires:
  tools:
    - python3
    - git
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - audit_hooks.py
  notes: Marked as network because audit_hooks.py matches words like curl and https:// in the hooks it reports. It makes no network calls; it reads settings files and scripts and runs git ls-files.
