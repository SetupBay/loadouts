id: claude-code-hook-audit
type: loadout
title: Audit agent hooks before you trust them
summary: "Hook security for Claude Code, Codex and Cursor: list every hook and settings command, flag guards that fail open, missing scripts, wrong exit codes and API redirects."
description: |
  A hook is code the agent runs on every tool call, and a project you clone can bring its own. Most of the ways a guard hook goes wrong are quiet. A script path with a typo exits 127 and the command runs anyway. A guard that denies with exit 1 never blocks. A PermissionRequest hook that relies on exit 2 is ignored. On Windows without Git Bash, a quoted path is printed instead of run, and before Claude Code 2.1.310 that let the tool call through. Settings can also run commands of their own (apiKeyHelper, statusLine) or set ANTHROPIC_BASE_URL. In October 2026 a planted CLAUDE.md used exactly that to send Claude Code's traffic and OAuth token to an attacker.

  This loadout gives your agent a read-only, standard-library audit for all of that. It lists every hook and settings command across Claude Code project, local, user and plugin settings, Codex's .codex/hooks.json and Cursor's .cursor/hooks.json. It then flags what fails open, what points at nothing, what calls the network and what redirects the agent. The rules keep hook changes with the human and say a guard only counts once you've seen it block something. The verifier runs the audit on a clean project and on one with a dozen planted faults.
highlights:
  - One inventory of hooks and settings commands for Claude Code, Codex and Cursor
  - Flags guards without onFailure block or failClosed, and scripts that don't exist
  - Catches exit 1 denies, exit 2 on PermissionRequest and quoted-path commands on Windows
  - Fails on project env that sets ANTHROPIC_BASE_URL, API keys, proxies or CA certificates
  - Warns on network calls, untracked or out-of-project scripts, apiKeyHelper and enableAllProjectMcpServers
  - Reference on how each agent loads, trusts and fails hooks, checked 29 October 2026
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
