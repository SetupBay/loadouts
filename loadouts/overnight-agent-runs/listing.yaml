    url: https://code.claude.com/docs/en/env-vars
  - title: "Claude Code docs: CLI reference (--max-budget-usd, --max-turns, --worktree)"
    url: https://code.claude.com/docs/en/cli-reference
  - title: "Claude Code changelog (2.1.239, 2.1.295, 2.1.301, 2.1.305 retry watchdog changes)"
    url: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
  - title: "@harshit10sehgal: CLAUDE_CODE_RETRY_WATCHDOG for unattended runs"
    url: https://x.com/harshit10sehgal/status/2110984543494967721
  - title: "@ekcheungAI: cap a headless run with --max-turns and --max-budget-usd"
    url: https://x.com/ekcheungAI/status/2111524159755010507
categories:
  - workflow
  - ai-agents
stacks:
  - python
  - git
  - bash
files:
  - path: AGENTS.md
    role: instructions
    description: Rules for any unattended agent task.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/night-shift/SKILL.md
    role: skill
    skill: night-shift
    description: Plan, run and review an overnight batch.
  - path: skills/night-shift/scripts/night_shift.py
    role: reference
    skill: night-shift
    description: Worktree-per-task runner with budgets, checks and a report.
  - path: skills/night-shift/references/night-shift.example.json
    role: reference
    skill: night-shift
    description: Example plan with three tasks.
requires:
  tools:
    - python3
    - git
    - claude
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - night_shift.py
  notes: The runner starts the agent command you put in the plan (which calls its model provider) and runs your finish-line commands. It creates worktrees and branches under .night-shift/, adds that folder to .git/info/exclude, and never pushes, merges or deletes anything.
