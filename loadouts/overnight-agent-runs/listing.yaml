id: overnight-agent-runs
type: loadout
title: Overnight agent runs with budgets and a morning report
summary: "Queue coding tasks to run unattended, each with a finish-line check, its own worktree and branch, a dollar cap inside a nightly total, and safe retry settings."
description: |
  Leaving agents running overnight is now common, and so are the two ways it goes wrong. One stuck task burns the whole budget. Or a rate or usage limit leaves a request waiting until morning with nothing done. Claude Code now has the controls for both. --max-budget-usd and --max-turns cap a print-mode run. CLAUDE_CODE_RETRY_WATCHDOG keeps retrying capacity errors, and since 2.1.295 and 2.1.301 it can be told to give up after a set wait or when a usage limit resets too far away.

  This loadout turns those controls into a routine. Every task needs a finish line (a command that exits 0), and each runs in its own git worktree and branch. A standard-library runner gives each task the smaller of its budget and what is left of the night's total, sets the retry variables, runs the finish-line check after the agent, and writes a ledger and a morning report with result, cost, turns and commits per branch. It refuses --dangerously-skip-permissions outside a sandbox and never pushes or merges. The verifier drives it with a stub agent that prints Claude Code's documented JSON result.
highlights:
  - One finish-line command per task; no check, no unattended run
  - Worktree and branch per task; nothing pushed, merged or deleted
  - Per-task --max-budget-usd inside a nightly total; queue stops when it runs out
  - "Retry watchdog with MAX_WAIT_MS and MAX_USAGE_LIMIT_WAIT_MS, so limits end runs instead of hanging them"
  - Morning report per branch with result, cost, turns and commits
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
