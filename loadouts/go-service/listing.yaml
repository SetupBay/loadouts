id: go-service
type: loadout
title: Go service rules
summary: "Go rules for agents: wrapped errors with errors.Is, context first, owned goroutines, 1.22+ routing, timeouts, and gofmt, vet and go test -race as the gate."
description: |
  Go is simple enough that agents produce working code fast, and idiomatic enough that reviewers spot the shortcuts: errors compared by string, goroutines with no way to stop, the default HTTP client with no timeout, a router library for what the standard mux now does. This loadout writes down the conventions from Effective Go and the Go blog, uses Go 1.22's method and path patterns, and ships a handler skill whose example and table-driven tests the verifier runs under the race detector.
highlights:
  - gofmt, go vet and go test -race as the done-gate
  - Errors wrapped with %w and checked with errors.Is / errors.As
  - context first; every goroutine has an owner and a stop
  - Go 1.22+ ServeMux patterns; no router library needed
  - Server and client timeouts, size-limited JSON bodies
