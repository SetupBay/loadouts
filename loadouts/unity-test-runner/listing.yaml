id: unity-test-runner
type: loadout
title: Unity tests from the command line, read properly
summary: "Run Unity Test Framework Edit Mode and Play Mode tests headless and read the NUnit results, so a run of zero tests (Unity exits 0) never passes as green."
description: |
  The Unity agent plugin lets coding agents edit scripts, scenes and assets. The step agents skip is proving the C# still works, and Unity's exit code makes that easy to get wrong. With -runTests, Unity exits 0 when every test passed and also when no tests ran at all, for example when a -testFilter matches nothing or the test assembly is missing. 3 means a run error, usually a compile error, and 4 a missing platform.

  This loadout adds the testing half for Unity 6 projects. The rules keep logic in plain C# classes so Edit Mode tests cover it in milliseconds, with a test .asmdef and an example NUnit test to copy. A standard-library Python wrapper runs the Editor in batch mode with the documented flags, deletes stale results first, and reads the NUnit 3 XML. It lists each failure with its message and first stack line, pulls C# compile errors and the "project already open" case out of the log, and treats zero tests as a failure. The verifier drives it with a stub Editor that writes each outcome Unity documents.
highlights:
  - "Zero tests ran = failure, even though Unity exits 0"
  - Exit codes 0/2/3/4 explained; compile errors pulled from the log
  - Stale result files deleted before every run
  - Edit Mode .asmdef and an NUnit example test to copy
  - Plain C# logic, thin MonoBehaviours, so tests run in milliseconds
