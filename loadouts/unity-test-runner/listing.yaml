    description: Testable C# layout and the rules for running Unity tests.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/unity-tests/SKILL.md
    role: skill
    skill: unity-tests
    description: Run tests headless and read the results.
  - path: skills/unity-tests/scripts/unity_tests.py
    role: reference
    skill: unity-tests
    description: Batch-mode runner and NUnit 3 results reader.
  - path: skills/unity-tests/references/EditModeTests.asmdef.json
    role: reference
    skill: unity-tests
    description: Edit Mode test assembly definition to copy.
  - path: skills/unity-tests/references/HealthTests.cs
    role: reference
    skill: unity-tests
    description: Example NUnit Edit Mode test.
requires:
  tools:
    - unity-6
    - python3
  env:
    - UNITY_PATH
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: false
  scripts:
    - unity_tests.py
  notes: The runner starts the Unity Editor binary named in UNITY_PATH in batch mode and writes results under TestResults/. It makes no network calls of its own.
