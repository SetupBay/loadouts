id: rails-rspec
type: loadout
title: Rails request specs with RSpec and FactoryBot
summary: "RSpec request specs for Rails 8.1 JSON endpoints: happy path, 422 errors, missing params, owner scoping and mass assignment, with FactoryBot and rubocop-rspec."
description: |
  Agents asked to test a Rails endpoint write a controller spec that checks the status code and stops there. The bugs that matter go untested: an unscoped find that shows another user's record, an owner_id accepted from the request body, a missing params key that turns into a 500. This loadout gives your agent RSpec rules for Rails 8.1. It uses request specs, not controller specs, with params.expect strong params and lookups scoped to the current owner. FactoryBot keeps the minimum valid record, with traits for variants. A skill lists what every endpoint's spec must cover and ships a complete, passing example. The verifier runs it in a Rails 8.1.4 API app on rspec-rails 8.0.4 in random order, runs rubocop with rubocop-rspec, and checks that removing the owner scope fails the 404 spec.
highlights:
  - Request specs through routing, middleware and params, not controller specs
  - "Every endpoint: happy path, 422, 400, someone else's record (404) and mass assignment"
  - params.expect strong params; ownership set from the session, never the body
  - FactoryBot sequences and traits; build_stubbed where no database is needed
  - Verified on Rails 8.1.4, rspec-rails 8.0.4 and rubocop-rspec 3.10.2
