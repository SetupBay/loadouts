    role: instructions
    description: Rails rules for migrations, models, controllers, secrets and gems.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/rails-model-change/SKILL.md
    role: skill
    skill: rails-model-change
    description: Add or change a model with a reversible migration and tests.
  - path: skills/rails-model-change/references/20261017120000_create_orders.rb
    role: reference
    skill: rails-model-change
    description: Migration with constraints, foreign key and unique indexes.
  - path: skills/rails-model-change/references/order.rb
    role: reference
    skill: rails-model-change
    description: Models with validations, normalizes and preloading scopes.
  - path: skills/rails-model-change/references/order_test.rb
    role: reference
    skill: rails-model-change
    description: Model tests including an N+1 guard.
requires:
