id: rails-app
type: loadout
title: Rails app rules
summary: "Rails 8 rules for agents: reversible migrations with real constraints, params.expect, N+1 checks with assert_queries_count, and rubocop and brakeman as the gate."
description: |
  Agents write Rails code that runs, then leave the database to the model layer: validations with no constraint behind them, migrations that only go up, an each loop that fires a query per row, permit! to make a form work. This loadout gives your agent the Rails 8 conventions from the official guides, with the commands that prove a change is done, and a model-change skill whose migration, models and tests the verifier runs on Active Record 8.1 and SQLite. The N+1 test is checked both ways: it passes with includes and fails without it.
highlights:
  - Every schema change is a reversible migration, checked by rolling back and migrating again
  - "Database constraints behind validations: null false, foreign keys, unique indexes"
  - params.expect, scoped record lookups and no html_safe on user content
  - assert_queries_count guards against N+1 queries
  - bin/rails test, bin/rubocop and bin/brakeman as the done-gate
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
  - title: "Rails Guides: Active Record migrations"
    url: https://guides.rubyonrails.org/active_record_migrations.html
  - title: "Rails Guides: testing Rails applications (assert_queries_count)"
    url: https://guides.rubyonrails.org/testing.html
  - title: "Rails Guides: Action Controller overview (params.expect)"
    url: https://guides.rubyonrails.org/action_controller_overview.html
  - title: "Rails Guides: securing Rails applications"
    url: https://guides.rubyonrails.org/security.html
  - title: rubocop-rails-omakase
