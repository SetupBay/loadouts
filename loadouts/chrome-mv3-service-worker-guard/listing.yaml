    role: reference
    skill: mv3-worker-guard
    description: Playwright test that stops the service worker through CDP and checks state survives.
  - path: skills/mv3-worker-guard/references/mv2-sample/background.js.txt
    role: reference
    skill: mv3-worker-guard
