requires:
  tools:
    - node
    - python3
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - mv3_worker_guard.py
  notes: The scanner only reads source files and manifest.json and prints findings; it never edits files and makes no network calls. Installing Playwright and its Chromium with npm downloads them.
