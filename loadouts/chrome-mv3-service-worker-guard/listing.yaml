id: chrome-mv3-service-worker-guard
type: loadout
title: Chrome MV3 service worker guard for MV2 code
summary: Stop agents writing MV2 background-page habits into MV3 extensions, such as globals as state and long timers, and prove state survives a service worker restart.
description: |
  A Manifest V3 extension's background script is a service worker. Chrome stops it after about 30 seconds without events and starts it again for the next one. Code written for an MV2 background page assumes it runs forever, so it works while you click around and breaks later: counters reset, timers never fire, and document, localStorage and XMLHttpRequest don't exist. Agents still write chrome.browserAction, tabs.executeScript, getBackgroundPage and blocking webRequest too.

  This loadout pairs a Cursor rule and AGENTS.md (what a service worker isn't, and the API replacements) with a skill that checks the work. A standard-library Python scanner reports MV2 APIs and things a worker can't do as errors, and lifecycle risks (globals, long timers, nested listeners, keep-alive hacks) as warnings. A Playwright test then stops the worker through the DevTools protocol and uses the extension again. The verifier runs it in Playwright's Chromium: storage-backed state survives the restart, and the same extension with a global counter resets to 0. It works alongside the Chrome extension (Manifest V3) loadout, which covers manifests, permissions and store review.
highlights:
  - Scanner flags MV2 APIs and DOM, localStorage or XHR in the worker
  - Warns on globals as state, long timers and listeners below the top level
  - Playwright test stops the service worker through CDP, then retries
  - Shows a global counter resetting to 0 after a real worker restart
  - API table from browserAction, executeScript and blocking webRequest to MV3
