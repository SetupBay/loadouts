    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/mv3-service-worker.mdc
    role: rules
    description: Never/always table for background scripts and manifest.json.
  - path: skills/mv3-worker-guard/SKILL.md
