files:
  - path: AGENTS.md
    role: instructions
    description: How to behave when a hook blocks you, and the hard limits behind the hooks.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/guard-rails.mdc
    role: rules
    description: Always-on Cursor rule with the same hard limits, for when the hooks don't fire in Cursor.
  - path: skills/install-guard-hooks/SKILL.md
    role: skill
    skill: install-guard-hooks
    description: Installs, tests and extends the three guard hooks and the permission rules.
  - path: skills/install-guard-hooks/scripts/guard-bash.sh
    role: reference
    skill: install-guard-hooks
    description: PreToolUse Bash guard that prints a deny decision with a reason.
  - path: skills/install-guard-hooks/scripts/post-edit-check.sh
    role: reference
    skill: install-guard-hooks
    description: PostToolUse fast check of the edited file.
  - path: skills/install-guard-hooks/scripts/stop-gate.sh
    role: reference
    skill: install-guard-hooks
    description: Stop hook that runs the tests once and respects stop_hook_active.
  - path: skills/install-guard-hooks/scripts/selftest.sh
    role: reference
    skill: install-guard-hooks
    description: Feeds sample hook input to each script and checks every decision.
  - path: skills/install-guard-hooks/references/settings.example.json
    role: reference
    skill: install-guard-hooks
    description: Hooks and permission rules to merge into .claude/settings.json.
  - path: skills/install-guard-hooks/references/permissions.md
    role: reference
    skill: install-guard-hooks
    description: What permissions and hooks really enforce, with version notes.
requires:
  tools: [bash, jq, git]
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts: [guard-bash.sh, post-edit-check.sh, stop-gate.sh, selftest.sh]
  notes: Marked as network because guard-bash.sh matches the words curl and wget in commands it blocks. The scripts make no network calls; they read hook input and run local checks.
