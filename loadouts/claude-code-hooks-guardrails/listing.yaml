id: claude-code-hooks-guardrails
type: loadout
title: Claude Code hooks guard rails
summary: Fail-closed PreToolUse, post-edit and Stop hooks that block force-pushes, .env reads and wild deletes, check each edit and run tests before done.
description: |
  Rules in CLAUDE.md are advice; hooks are enforcement. This loadout installs three small bash + jq hooks
  that practitioners converged on in autumn 2026: a PreToolUse guard that denies the handful of commands
  that cause real damage (with a reason the agent can act on), a fast per-file check after every edit, and
  a Stop gate that runs the tests once and refuses to let the agent finish on red. It uses the hook
  semantics that matter: only exit 2 or a deny decision blocks, `onFailure: "block"` so a broken hook fails
  closed, and `stop_hook_active` so the Stop gate can never loop. A self-test proves every block works.
highlights:
  - Bash guard denies force-push, reset --hard, --no-verify, .env access, deletes outside the project and DROP/TRUNCATE
  - Post-edit check on just the changed file (bash -n, jq, ruff, eslint) so errors surface immediately
  - Stop gate runs the test command once, skips clean trees and respects stop_hook_active
  - settings.json snippet with onFailure block, exec-form args and Read deny rules for .env*
  - 34-case self-test, plus a reference on what permissions and hooks really enforce
  - Notes for Codex (project or user hooks.json) and Cursor (which can load the Claude Code hooks), with what carries over
