id: fastapi-async-sqlalchemy
type: loadout
title: FastAPI with async SQLAlchemy 2.1 and Alembic
summary: 'FastAPI on async SQLAlchemy 2.1: per-request AsyncSession, lazy="raise" with eager loads, async Alembic with alembic check, and tests that count queries.'
description: |
  Agents writing async SQLAlchemy reach for habits from sync code. They lazy-load a relationship inside an async route and hit MissingGreenlet, or share one AsyncSession across asyncio.gather. SQLAlchemy 2.1 adds a new trap: it no longer installs greenlet, so a project that declares plain sqlalchemy cannot start an async engine. This loadout sets the rules: a per-request session dependency, expire_on_commit=False, lazy="raise" on every relationship with selectinload for what the response needs, explicit commits with IntegrityError mapped to 409, and database URLs from the environment. The skill adds a resource end to end, with model, reviewed Alembic migration, router and async tests that assert the query count. The verifier runs the tests on SQLAlchemy 2.1.5 and FastAPI 0.143.3. It upgrades and downgrades the migration, confirms alembic check catches model drift, and shows the greenlet failure.
highlights:
  - SQLAlchemy 2.1 needs sqlalchemy[asyncio]; the verifier shows the greenlet error
  - 'lazy="raise" plus selectinload: the list test asserts exactly two SELECTs'
  - One AsyncSession per request, never shared across tasks
  - Async Alembic env from DATABASE_URL; alembic check catches model drift
  - httpx AsyncClient over ASGITransport with a fresh database per test
