id: django-app
type: loadout
title: Django app rules
summary: "Django rules and a safe-migration skill: migrations checked in CI, two-step destructive changes, N+1 caught with query-count tests, settings from the environment."
description: |
  Agents are quick at Django and quick to leave behind the classic problems: model changes without migrations, edited migrations that already ran, N+1 queries in list views, csrf_exempt to make a form work, DEBUG and SECRET_KEY in code. This loadout sets the rules from Django's own docs, adds makemigrations --check and check --deploy as gates, and ships a safe-migration skill with a two-release path for removals and renames and a query-count test that the verifier runs against a real N+1.
highlights:
  - makemigrations --check --dry-run and manage.py check as done-gates
  - Two-release path for removing or renaming columns
  - assertNumQueries test that catches N+1 queries
  - Data migrations with apps.get_model and a backwards function
  - No csrf_exempt, no |safe on user input, secrets from the environment
