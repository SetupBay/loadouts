id: agent-plugin-authoring
type: loadout
title: Author plugins for Claude Code and Antigravity
summary: Build one plugin for Claude Code and Antigravity from a single source tree, pin its MCP servers, and pass claude plugin validate --strict before anyone installs.
description: |
  Claude Code and Antigravity both install plugins made of skills, subagents and MCP servers, but the manifests differ. Claude Code reads .claude-plugin/plugin.json and .mcp.json with url. Antigravity reads a root plugin.json whose schema allows only a name and description, and mcp_config.json with serverUrl. It has no validate command. This loadout keeps one portable source tree and builds both layouts plus a local marketplace. A checker catches extra manifest fields, reserved names, unpinned npx servers, http remotes, literal credentials and drift between the builds. The verifier builds the example plugin and runs Claude Code 2.1.302's own validate --strict on the plugin and marketplace, with no account needed. It then confirms a broken source fails both checkers. It pairs with the agent-extension-vetting loadout for the reviewer's side.
highlights:
  - One plugin-src tree builds both Claude Code and Antigravity layouts
  - Antigravity manifest checked against its documented schema (it has no validate command)
  - claude plugin validate --strict on the plugin and marketplace, no sign-in
  - Exact MCP pins, https remotes, no literal credentials in env or headers
  - "Release notes: version bumps and sha pins for GitHub marketplace sources"
