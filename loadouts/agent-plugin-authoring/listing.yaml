files:
  - path: AGENTS.md
    role: instructions
    description: Rules for building and releasing a plugin for Claude Code and Antigravity from one source tree.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/build-agent-plugin/SKILL.md
    role: skill
    skill: build-agent-plugin
    description: Layout differences, build, check, local test and release.
  - path: skills/build-agent-plugin/scripts/build_plugins.mjs
    role: reference
    skill: build-agent-plugin
    description: Builds both plugin layouts and a local marketplace.
  - path: skills/build-agent-plugin/scripts/check_plugins.mjs
    role: reference
    skill: build-agent-plugin
    description: Schema, parity, pin and credential checks for both builds.
  - path: skills/build-agent-plugin/references/plugin-src/plugin.json
    role: reference
    skill: build-agent-plugin
    description: Example source manifest with a pinned MCP server.
  - path: skills/build-agent-plugin/references/plugin-src/skills/tidy-pr/SKILL.md
    role: reference
    skill: build-agent-plugin
    description: Example portable skill.
  - path: skills/build-agent-plugin/references/plugin-src/agents/pr-reviewer.md
    role: reference
    skill: build-agent-plugin
    description: Example portable subagent.
requires:
  tools:
    - nodejs
    - npm
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - build_plugins.mjs
    - check_plugins.mjs
  notes: The scripts read and write files under the folders you name and make no network calls. npx downloads Claude Code only to run plugin validate. The example plugin declares one MCP server (Context7, pinned to 4.4.2) that runs only when someone installs the plugin.
