license: MIT
author:
  name: SetupBay
credits:
  - title: datalayer/jupyter-mcp-server (README, MCP SDK 2 note, uvx setup)
    url: https://github.com/datalayer/jupyter-mcp-server
  - title: "Jupyter MCP Server docs: tool reference (22 tools, 1 prompt)"
    url: https://jupyter-mcp-server.datalayer.tech/mcp
  - title: "Claude Code docs: environment variable expansion in .mcp.json"
    url: https://code.claude.com/docs/en/mcp
  - title: "OpenAI Codex docs: MCP servers (env_vars)"
    url: https://developers.openai.com/codex/mcp
  - title: "nbclient docs: executing notebooks"
    url: https://nbclient.readthedocs.io/en/latest/client.html
categories:
  - data
  - workflow
stacks:
  - python
  - jupyter
  - uv
files:
  - path: AGENTS.md
    role: instructions
    description: Rules for working in a live notebook through Jupyter MCP.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/live-notebook/SKILL.md
    role: skill
    skill: live-notebook
    description: Read, change and prove a notebook through the Jupyter MCP tools.
  - path: skills/live-notebook/scripts/nb_check.py
    role: reference
    skill: live-notebook
    description: Standard-library check of saved notebooks (order, errors, secrets).
  - path: skills/live-notebook/scripts/run_fresh.py
    role: reference
    skill: live-notebook
    description: Restart-and-run-all with nbclient (uv inline dependencies pinned).
  - path: skills/live-notebook/references/setup.md
    role: reference
    skill: live-notebook
    description: How the human starts JupyterLab safely and passes the token.
  - path: mcp.json
    role: mcp
    description: Jupyter MCP Server 2.2.4 over stdio, token from the environment.
requires:
  tools:
    - uv
    - python3
  env:
    - JUPYTER_TOKEN
  mcp:
    - jupyter
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - nb_check.py
    - run_fresh.py
  notes: uvx fetches jupyter-mcp-server and uv fetches nbclient and ipykernel on first run. The MCP server runs code in the JupyterLab kernel the human started on 127.0.0.1. nb_check.py only reads notebooks.
