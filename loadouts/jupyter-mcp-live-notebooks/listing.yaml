id: jupyter-mcp-live-notebooks
type: loadout
title: Live Jupyter notebooks through Jupyter MCP
summary: "Agents in a running JupyterLab via jupyter-mcp-server 2.2.4: loopback and a random token, saved cells over hidden kernel state, and a fresh-kernel rerun before done."
description: |
  Jupyter MCP Server lets Claude Code, Codex, Cursor and other MCP clients read, edit and run cells in a JupyterLab you have open, with outputs and plots coming back to the agent. It's powerful and easy to misuse. The quick start binds JupyterLab to 0.0.0.0 with a fixed token. The live kernel remembers everything the agent ran, including code sent with execute_code that never lands in a cell. So a notebook can look done and then fail on Restart and Run All.

  This loadout pins jupyter-mcp-server 2.2.4 and has the human start JupyterLab on 127.0.0.1 with a random token passed through the environment. It sets the working rules: read the notebook first, use execute_code only for read-only peeks, keep every step in a saved cell with an assertion, install packages in the project rather than from %pip cells, and keep secrets out of outputs. Done means a restart and a top-to-bottom run. Two small scripts check that: nb_check.py (standard library) fails notebooks whose execution counts aren't 1 to n in order, that were saved with errors or that leak secrets. run_fresh.py does restart-and-run-all with nbclient when there's no server, for example in CI. It pairs with the Jupytext-based jupyter-notebooks loadout.
highlights:
  - jupyter-mcp-server 2.2.4 pinned, JupyterLab on 127.0.0.1 with a random JUPYTER_TOKEN
  - Saved cells for every step; execute_code only for read-only peeks
  - Restart and run all before done, then nb_check.py on the saved file
  - nb_check.py fails out-of-order counts, saved errors and secrets in outputs
  - run_fresh.py reruns a notebook in a fresh kernel without a server (nbclient 0.11.0)
  - Notes on passing the token in Claude Code (${VAR}) and Codex (env_vars)
