    role: instructions
    description: Electron rules for windows, preload, IPC, packaging and dependencies.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/electron-ipc-channel/SKILL.md
    role: skill
    skill: electron-ipc-channel
    description: Add a typed, sender-checked IPC channel.
  - path: skills/electron-ipc-channel/references/main.ts
    role: reference
    skill: electron-ipc-channel
    description: "Main process: window, protocol, IPC handlers."
  - path: skills/electron-ipc-channel/references/preload.ts
    role: reference
    skill: electron-ipc-channel
    description: Narrow contextBridge API.
  - path: skills/electron-ipc-channel/references/renderer-api.d.ts
    role: reference
    skill: electron-ipc-channel
    description: Window API types for the renderer.
  - path: skills/electron-ipc-channel/references/flip-fuses.ts
    role: reference
    skill: electron-ipc-channel
    description: Fuses hardening for packaged builds.
  - path: skills/electron-ipc-channel/scripts/check_electron_security.mjs
    role: reference
    skill: electron-ipc-channel
    description: Static check against the Electron security checklist.
requires:
  tools:
    - node
    - npm
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - check_electron_security.mjs
  notes: npm installs Electron and @electron/fuses. The security check only reads source files. The example opens external links in the browser only for https URLs and blocks navigation away from the app.
