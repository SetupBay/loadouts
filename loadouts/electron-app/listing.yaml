id: electron-app
type: loadout
title: Electron desktop app rules
summary: "Electron rules for agents: sandboxed renderers, narrow contextBridge APIs, sender-checked IPC, deny-by-default windows, CSP and fuses, with a static security check."
description: |
  Agents build Electron apps that work and then turn off the protections to make a feature easier: nodeIntegration on, contextIsolation off, ipcRenderer handed straight to the page, shell.openExternal on whatever URL arrives. This loadout writes the Electron security checklist into rules your agent follows, and ships a skill for adding IPC channels the safe way: a named preload function, a fixed channel, an ipcMain.handle that checks event.senderFrame and validates every argument. A small static check catches the common regressions. The verifier type-checks the examples against Electron 44's types and runs the check on a good and an insecure app.
highlights:
  - contextIsolation, sandbox and nodeIntegration written out, never weakened
  - IPC through named preload functions; handlers check senderFrame and validate input
  - Custom app:// protocol instead of file://; deny-by-default window and navigation handlers
  - Fuses flipped at package time with @electron/fuses
  - Static check mapped to the numbered Electron security checklist
version: 1.0.0
license: MIT
author:
  name: SetupBay
