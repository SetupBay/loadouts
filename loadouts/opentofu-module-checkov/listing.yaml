id: opentofu-module-checkov
type: loadout
title: OpenTofu modules gated by tofu test and Checkov
summary: "Agents write OpenTofu modules that pass a local gate: fmt, a read-only lock file, tofu test with a mocked AWS provider, and Checkov with reasoned skips only."
description: |
  Ask an agent for a bucket and you get a public ACL, no encryption and a Checkov skip with no reason, or a soft-fail flag that turns the scan into decoration. This loadout gives your agent a gate it runs before calling a module change done. It checks formatting, runs init against the committed lock file, validates, and runs tofu test against a mocked AWS provider, so no credentials are needed and nothing is created. Checkov runs last. It refuses soft-fail, repo-wide skip lists and inline skips without a reason. A complete S3 bucket module shows the target, with tests that check its secure defaults and every validation rule. A root example enforces OpenTofu's native state and plan encryption. The verifier runs it on OpenTofu 1.13.1, the AWS provider 6.69.1 and Checkov 3.3.29. It also checks that a reasonless skip, soft-fail, suspended versioning and an agent-written public bucket all fail.
highlights:
  - "One gate script: fmt, read-only lock file, validate, tofu test, Checkov"
  - "tofu test with mock_provider: no AWS credentials, nothing created"
  - Checkov exceptions only as inline skips with a reason; soft-fail refused
  - Root example with OpenTofu state and plan encryption enforced
  - Verified on OpenTofu 1.13.1, AWS provider 6.69.1 and Checkov 3.3.29
