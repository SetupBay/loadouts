files:
  - path: AGENTS.md
    role: instructions
    description: Rules for OpenTofu modules that pass fmt, validate, tofu test and Checkov before a person plans and applies.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/tofu-module-gate/SKILL.md
    role: skill
    skill: tofu-module-gate
    description: Workflow, Checkov exception rules, lock file and state encryption.
  - path: skills/tofu-module-gate/scripts/gate.sh
    role: reference
    skill: tofu-module-gate
    description: fmt, init (read-only lock), validate, tofu test, exception audit, Checkov.
  - path: skills/tofu-module-gate/references/main.tf
    role: reference
    skill: tofu-module-gate
    description: Private, versioned, SSE-KMS S3 bucket with logging and a TLS-only policy.
  - path: skills/tofu-module-gate/references/variables.tf
    role: reference
    skill: tofu-module-gate
    description: Typed, described inputs with validation blocks.
  - path: skills/tofu-module-gate/references/outputs.tf
    role: reference
    skill: tofu-module-gate
    description: Module outputs.
  - path: skills/tofu-module-gate/references/versions.tf
    role: reference
    skill: tofu-module-gate
    description: OpenTofu and AWS provider version constraints.
  - path: skills/tofu-module-gate/references/bucket.tftest.hcl
    role: reference
    skill: tofu-module-gate
    description: Four tofu test runs against a mocked AWS provider.
  - path: skills/tofu-module-gate/references/example-root.tf
    role: reference
    skill: tofu-module-gate
    description: Root module with enforced state and plan encryption.
  - path: skills/tofu-module-gate/references/checkov.yaml
    role: reference
    skill: tofu-module-gate
    description: Repository Checkov config with no soft-fail or skip list.
requires:
  tools:
    - tofu
    - uv
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - gate.sh
  notes: "tofu init downloads the hashicorp/aws provider from the OpenTofu registry, checked against the committed lock file. uvx downloads Checkov 3.3.29 from PyPI. Tests use a mocked provider: no credentials, no cloud API calls."
