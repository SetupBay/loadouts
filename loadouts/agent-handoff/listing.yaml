id: agent-handoff
type: loadout
title: Handoff without compaction
summary: "Write HANDOFF.md before you clear context or switch agents: goal, decisions, exact failing test, next step, commit. A checker flags stale or incomplete handoffs."
description: |
  Automatic compaction keeps what a summariser thought mattered, and decisions are the first thing to go. Practitioners have converged on the same fix: before clearing context or moving work to another agent or person, write a short handoff file with the goal, files touched, decisions and why, the exact failing test and error, and one next step. This loadout makes that a habit. One skill writes HANDOFF.md from git facts and a template; another resumes from it by re-running the verify commands before changing anything. A small checker flags missing sections, leftover placeholders, secrets, and handoffs written at an older commit. The verifier runs the checker through a template, a good handoff, a stale one and a leaky one.
highlights:
  - Write a handoff before /clear, compaction or switching agents, not after
  - "Template: goal, state, files, decisions, exact failure, next step, verify commands"
  - Checker compares the recorded commit with HEAD and counts the commits since
  - Resume skill re-runs the checks and confirms the next step before editing
  - Works across Claude Code, Codex, Antigravity, Cursor and Copilot
version: 1.0.0
license: MIT
author:
  name: SetupBay
