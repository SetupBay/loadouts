stacks:
  - any
  - git
files:
  - path: AGENTS.md
    role: instructions
    description: When to write and read a handoff file, and what goes in it.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/write-handoff/SKILL.md
    role: skill
    skill: write-handoff
    description: Write HANDOFF.md from git facts and check it.
  - path: skills/write-handoff/references/HANDOFF.template.md
    role: reference
    skill: write-handoff
    description: Handoff template with every required section.
  - path: skills/write-handoff/scripts/check_handoff.py
    role: reference
    skill: write-handoff
    description: Checks sections, commit freshness, length and secrets.
  - path: skills/resume-from-handoff/SKILL.md
    role: skill
    skill: resume-from-handoff
    description: "Start a session from HANDOFF.md: check, re-run, confirm."
requires:
  tools:
    - python3
    - git
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: false
  scripts:
    - check_handoff.py
  notes: The checker reads HANDOFF.md and runs read-only git commands. No network access. It rejects secret-shaped strings so a handoff can be shared safely.
