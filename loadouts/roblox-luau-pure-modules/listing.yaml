id: roblox-luau-pure-modules
type: loadout
title: Roblox pure Luau modules checked outside Studio
summary: Keep Roblox game rules in pure --!strict Luau modules that the luau CLI can type-check and test in milliseconds, with a scanner that keeps Roblox APIs out of them.
description: |
  Roblox logic is usually tried out by pressing Play in Studio, which an agent can't do after every change. Rules that never touch the DataModel can be checked by the standalone Luau tools instead: luau-analyze type-checks them in strict mode, and luau runs their tests from the command line.

  This loadout sets out the split. Prices, inventory, damage and cooldown maths go in src/shared/pure as --!strict modules that require each other by string (require("./Money"), which Roblox and the luau CLI both resolve). Server and client scripts stay as thin edges that own services, Instances and remotes. A standard-library Python scanner flags Roblox-only calls in the pure folder (game, workspace, script.Parent requires, Instance.new, services, task and the deprecated wait/spawn/delay, Roblox datatypes) as errors, and math.random, os.time and print as warnings. A small test runner prints PASS or FAIL per case and exits non-zero on failure. The verifier runs it all with the official Luau 0.743 tools on a Rojo shop project, and shows a broken rule failing the run.
highlights:
  - Pure --!strict modules in src/shared/pure, thin edge scripts for Roblox APIs
  - Scanner flags game, script.Parent requires, Instance.new and task.* in pure code
  - luau-analyze --mode=strict checks the rules and their tests outside Studio
  - A tiny test runner for the luau CLI that exits non-zero on failure
  - String requires that work in both Roblox and the luau CLI
