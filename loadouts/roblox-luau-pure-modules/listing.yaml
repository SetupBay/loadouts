categories:
  - gamedev
stacks:
  - roblox
  - luau
  - rojo
files:
  - path: AGENTS.md
    role: instructions
    description: The pure/edge split, the rules for each, and the done checklist.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/luau-pure-modules.mdc
    role: rules
    description: Never/instead table for pure modules and tests.
  - path: skills/luau-pure-tests/SKILL.md
    role: skill
    skill: luau-pure-tests
    description: Check purity, type-check in strict mode, then run the tests with the luau CLI.
  - path: skills/luau-pure-tests/scripts/pure_luau_guard.py
    role: reference
    skill: luau-pure-tests
    description: Read-only scanner for Roblox-only calls in pure Luau modules.
  - path: skills/luau-pure-tests/references/run.luau
    role: reference
    skill: luau-pure-tests
    description: Minimal test runner for spec files under the luau CLI.
  - path: skills/luau-pure-tests/references/studio-coupled-sample.luau.txt
    role: reference
    skill: luau-pure-tests
    description: A Studio-coupled inventory module for checking the guard.
requires:
  tools:
    - python3
    - luau
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: false
  scripts:
    - pure_luau_guard.py
  notes: The scanner only reads .luau and .lua files and prints findings; it never edits files and makes no network calls. The test runner only runs the project's own spec files.
