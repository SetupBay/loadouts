id: phaser-4-api-guard
type: loadout
title: Phaser 4 guard for Phaser 3 pipelines, FX and masks
summary: Stop agents writing setPipeline, preFX, postFX, BitmapMask and setTintFill into Phaser 4 games, and catch the Math.TAU change that compiles but breaks rotations.
description: |
  npm i phaser has installed Phaser 4 since April 2026, but nearly every Phaser example an agent learnt from is Phaser 3. Phaser 4 replaced the WebGL renderer, so the commonest Phaser 3 calls are gone: pipelines (setPipeline('Light2D')), preFX and postFX, BitmapMask, setTintFill, Geom.Point and Structs.Set. Other changes compile and still break the game: Math.TAU is now PI * 2 rather than PI / 2, RenderTexture drawing waits for render(), and roundPixels is off by default.

  This loadout pairs a short Cursor rule and AGENTS.md (check the version, then a never/always table) with a skill that checks the work. A standard-library Python scanner reports removed Phaser 3 APIs as errors and the silent changes as warnings, then tsc checks the code against Phaser 4's own types. It also points the agent at the migration skills Phaser now ships inside the npm package. The verifier runs it on a Phaser 4 scene and a Phaser 3.90 sample with the pinned phaser 4.2.1 and TypeScript 7.0.2.
highlights:
  - Checks package.json first, and stays on Phaser 3 if the game is still 3.x
  - Scanner flags pipelines, preFX/postFX, BitmapMask and setTintFill as errors
  - Warns on Math.TAU, now PI * 2, and RenderTexture draws without render()
  - tsc against Phaser 4.2.1's types rejects every removed call in the sample
  - Points agents at the migration skills shipped in node_modules/phaser/skills
