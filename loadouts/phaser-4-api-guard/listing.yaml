    - node
    - python3
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - phaser4_guard.py
  notes: The scanner only reads source files and package.json and prints findings; it never edits files and makes no network calls. Installing the project's pinned packages with npm downloads them.
