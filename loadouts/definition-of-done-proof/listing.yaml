id: definition-of-done-proof
type: loadout
title: Definition of done for agents, with proof
summary: Make "done" mean the feature works, a test shows it, and no test was weakened, with a git-diff check for changed assertions, skips and deleted tests.
description: |
  A definition of done written for people says "tests pass", and everyone knows that also means someone clicked through the feature. Agents read it literally. When a test fails, changing the expected value, deleting the assertion or adding a skip marker is the cheapest way to green, and the agent reports done. Developers keep finding this out after merging.

  This loadout rewrites done for agents: the behaviour was run and seen, new behaviour has a new test (a bug fix has one that failed first), the full suite passes, nothing was checked by "should work", and no existing test was loosened. A standard-library Python script reads the git diff of test files and reports changed expectations, removed assertions, added skip/xfail/only/ignore markers, deleted tests and changed snapshots. It works across pytest, Jest/Vitest, Go, Rust, JUnit and Swift Testing, and counts new tests without blocking them. Human-approved test changes go in an allow list that only the human edits. An optional Claude Code Stop hook turns the check into a wall, and a report template puts evidence next to every claim.
highlights:
  - "Done = seen working + a test that shows it + no weakened tests + what wasn't checked"
  - Diff check for changed expectations, removed asserts, skips, deleted tests, snapshots
  - Works on pytest, Jest/Vitest, Go, Rust, JUnit and Swift Testing files
  - Human-only allow list for test changes that were genuinely wrong
  - Optional Claude Code Stop hook (exit 2, loop-safe) and a done-report template
