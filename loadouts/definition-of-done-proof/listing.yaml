categories:
  - workflow
  - ai-agents
stacks:
  - git
  - python
  - bash
  - pytest
files:
  - path: AGENTS.md
    role: instructions
    description: The five-part definition of done and what to do when a test seems wrong.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/done-proof/SKILL.md
    role: skill
    skill: done-proof
    description: Prove done with a failing-then-passing test, a run of the feature and the tamper check.
  - path: skills/done-proof/scripts/test_tamper.py
    role: reference
    skill: done-proof
    description: Git-diff check for weakened, skipped or deleted tests.
  - path: skills/done-proof/scripts/done-gate.sh
    role: reference
    skill: done-proof
    description: Optional Claude Code Stop hook that runs the tamper check.
  - path: skills/done-proof/references/stop-hook.example.json
    role: reference
    skill: done-proof
    description: Settings snippet for the Stop hook.
  - path: skills/done-proof/references/done-report.md
    role: reference
    skill: done-proof
    description: The done report template.
requires:
  tools:
    - git
    - python3
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: false
  scripts:
    - test_tamper.py
    - done-gate.sh
  notes: The check only runs read-only git commands (rev-parse, diff, ls-files) and reads test files. The optional Stop hook runs that check and nothing else, and is installed only if you merge the settings snippet.
