    description: The build, preview and test loop with Xcode's MCP tools.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/xcode-mcp-loop/SKILL.md
    role: skill
    skill: xcode-mcp-loop
    description: Connect, edit, build, render previews, test and report.
  - path: skills/xcode-mcp-loop/scripts/preview_check.py
    role: reference
    skill: xcode-mcp-loop
    description: Lists RenderPreview targets and flags previews that touch live services.
  - path: skills/xcode-mcp-loop/references/tools.md
    role: reference
    skill: xcode-mcp-loop
    description: The Xcode MCP tools, what each is for, and one-time setup.
  - path: mcp.json
    role: mcp
    description: Xcode's MCP server through xcrun mcpbridge (macOS, Xcode running).
requires:
  tools:
    - xcode
    - python3
  mcp:
    - xcode
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - preview_check.py
  notes: The only MCP server is Apple's mcpbridge, which drives the local Xcode; its DocumentationSearch tool queries Apple's documentation, and Xcode asks the human to allow each agent connection. preview_check.py only reads Swift files.
