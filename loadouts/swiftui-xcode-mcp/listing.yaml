id: swiftui-xcode-mcp
type: loadout
title: SwiftUI with Xcode's MCP tools (build, preview, test)
summary: "Use Xcode 26.3+'s MCP server (xcrun mcpbridge) to build, read the log, render and look at SwiftUI previews, and run tests after every change."
description: |
  Since Xcode 26.3, Xcode has its own MCP server. Claude Code, Codex, Cursor and other agents can connect to it through `xcrun mcpbridge` to build the open project, read the build log and Issue Navigator, run tests, search Apple's documentation and render SwiftUI previews to PNGs. That last one matters most: the agent can finally see the UI it changed instead of guessing from the source.

  This loadout sets the loop: XcodeListWindows for the tab identifier, BuildProject and GetBuildLog after every change, RenderPreview for every view touched (and actually looking at the image), RunSomeTests then RunAllTests, and DocumentationSearch before using an unfamiliar API. It keeps the agent away from the scheme, run destination, signing and file deletions unless asked. preview_check.py (standard library, runs on any OS) lists every preview as a RenderPreview target with its zero-based index, and flags previews that hit the network, `.shared` singletons, UserDefaults or environment secrets, plus views with no preview at all. It pairs with the swiftui-swift-test-ci loadout for Linux CI.
highlights:
  - Xcode MCP over xcrun mcpbridge, with setup lines for Claude Code, Codex and Cursor
  - Build, read the error log, render previews, run tests, after every change
  - RenderPreview targets (path and zero-based index) listed by preview_check.py
  - Flags previews that use the network, singletons, UserDefaults or env secrets
  - Views without a preview are flagged so the agent can see what it changed
  - Scheme, destination, signing and file deletions left to the human
