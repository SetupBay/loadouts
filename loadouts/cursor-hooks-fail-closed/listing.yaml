id: cursor-hooks-fail-closed
type: loadout
title: Cursor hooks that fail closed for shell, reads and MCP
summary: A Python guard for Cursor's permission hooks that blocks risky commands, secret reads and unlisted MCP servers, set to fail closed, with a config checker and self-test.
description: |
  Cursor hooks fail open by default. If a guard script crashes, times out or exits with anything other than 2, Cursor logs it and lets the action through, unless the hook sets failClosed. beforeMCPExecution doesn't run in cloud agents either, and preToolUse doesn't enforce "ask". A hook that looks right can still guard nothing.

  This loadout ships one standard-library Python script that answers beforeShellExecution, beforeReadFile, beforeMCPExecution and preToolUse (matcher ^MCP:, so cloud agents are covered too), with every hook set to failClosed. It denies recursive deletes outside the project, force pushes, --no-verify, downloads piped into a shell, reads of .env files and keys (by path or by content) and MCP servers missing from an allowlist. It asks before sudo, reset --hard and publishing. A checker flags hooks.json mistakes: hooks that fail open, ./hooks paths in project hooks, missing scripts, bad regex matchers, misspelt events and cloud-agent gaps. A self-test pipes 30 hook payloads through the guard. The verifier runs both, and shows that a malformed payload or a missing policy blocks rather than allows.
highlights:
  - One stdlib Python guard for shell, file-read and MCP permission hooks
  - Every hook sets failClosed, so a crash or timeout blocks the action
  - preToolUse with matcher ^MCP covers cloud agents, where beforeMCPExecution doesn't run
  - Checker flags fail-open hooks, ./hooks paths, bad matchers and missing scripts
  - Self-test pipes 30 payloads and proves failures block, not allow
