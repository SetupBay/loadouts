requires:
  tools:
    - python3
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - cursor_guard.py
    - hooks_check.py
    - selftest.py
  notes: The guard reads one hook payload from stdin and its policy file, and prints a decision. The checker only reads hooks.json. The self-test runs the guard on sample payloads. None of them edit files or make network calls. Marked as network because the guard and its tests match the words curl and wget in commands they block.
