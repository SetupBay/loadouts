    url: https://docs.expo.dev/build/eas-json/
  - title: expo/eas-cli
    url: https://github.com/expo/eas-cli
categories:
  - web-app
  - workflow
stacks:
  - expo
  - react-native
  - typescript
  - github-actions
files:
  - path: AGENTS.md
    role: instructions
    description: Rules for an Expo app updated over the air with EAS Update, where native changes always get a new build.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/eas-update-release/SKILL.md
    role: skill
    skill: eas-update-release
    description: Config, the OTA-safe check, and who publishes where.
  - path: skills/eas-update-release/scripts/ota_check.mjs
    role: reference
    skill: eas-update-release
    description: "config, record and compare: fingerprint and update config checks."
  - path: skills/eas-update-release/references/app.json
    role: reference
    skill: eas-update-release
    description: App config with the fingerprint policy and updates.url.
  - path: skills/eas-update-release/references/eas.json
    role: reference
    skill: eas-update-release
    description: Build profiles with one channel each.
  - path: skills/eas-update-release/references/eas-update-preview.yml
    role: reference
    skill: eas-update-release
    description: "GitHub workflow: publish to preview only when OTA-safe."
requires:
  tools:
    - node
    - npm
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - ota_check.mjs
  notes: The check runs the project's own expo and expo-updates CLIs and makes no network calls. The example workflow publishes to the preview channel with an EXPO_TOKEN from GitHub secrets; agents never publish to production.
