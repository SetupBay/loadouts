id: expo-eas-update
type: loadout
title: Expo EAS Update without shipping native changes over the air
summary: Checks whether an Expo change can ship as an EAS Update or needs a new build, using the native fingerprint; preview by CI, production rollouts by a person.
description: |
  An EAS Update swaps the JavaScript inside a build, but it cannot add native code. An agent that installs expo-camera and then runs eas update ships a crash to every user on that build. This loadout gives your agent a check it runs before any update. It records the native fingerprint when a store build is cut, then compares the current project against it with expo-updates' own fingerprint tool. JavaScript and version bumps pass. A new native module, config plugin or permission fails, and the output names what changed. A config check makes sure runtimeVersion uses the fingerprint policy, updates.url matches the project and every build profile has its own channel. It validates eas.json with Expo's own parser. CI publishes to preview only. Production goes out as a staged rollout run by a person. The verifier runs it on Expo SDK 58 with expo-updates 58.0.17.
highlights:
  - OTA-safe or needs a new build, from the expo-updates native fingerprint
  - "Names what changed: added native modules, config, autolinking"
  - Fingerprint runtime policy, matching updates.url, one channel per build profile
  - CI publishes to preview only; production is a person's staged rollout
  - Verified on Expo SDK 58, expo-updates 58.0.17 and @expo/eas-json 25.1.1
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
