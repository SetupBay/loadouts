id: pandas-3-upgrade-guard
type: loadout
title: pandas 3 guard for copy-on-write and removed APIs
summary: Stop agents writing applymap, fillna(method=), freq="H" and chained assignment into pandas 3 projects, where copy-on-write silently drops the write.
description: |
  pandas 3.0 removed the APIs deprecated through 2.x and made two behaviour changes permanent. Copy-on-write is always on, so chained assignment such as df["v"][0] = 1, or df["v"].fillna(0, inplace=True), changes a temporary copy and leaves the frame untouched, with only a warning. Strings are now the str dtype, so dtype == object checks quietly stop matching. Agents learnt pandas from a decade of answers that rely on all of this.

  This loadout pairs a short Cursor rule and AGENTS.md (a never/always table) with a skill that checks the work. A standard-library Python scanner reports removed APIs (applymap, append, fillna(method=), delim_whitespace, date_parser, old offset aliases such as H and M, errors="ignore") and chained writes as errors, and object-dtype checks and agg(np.sum) as warnings. Then the tests run with ChainedAssignmentError raised as an error, so every lost write fails. The verifier runs the scanner against a pandas 3 script and a pandas 2 sample, and runs both with the pinned pandas 3.1.0.
highlights:
  - Never/always table for pandas 3 in a .py-scoped Cursor rule
  - Scanner flags removed APIs and chained writes as errors, read-only
  - Catches writes copy-on-write throws away, like df["v"][0] = 1
  - Tests run with ChainedAssignmentError as an error, so lost writes fail
  - Warns on object-dtype string checks now that strings are dtype str
