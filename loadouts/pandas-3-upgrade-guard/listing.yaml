    url: https://x.com/jmdevilleros/status/2112904481021075601
categories:
  - data
stacks:
  - pandas
  - python
  - uv
files:
  - path: AGENTS.md
    role: instructions
    description: pandas 3 version facts, rules and the done checklist.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/pandas-3-only.mdc
    role: rules
    description: Never/always table for Python files.
  - path: skills/pandas-3-guard/SKILL.md
    role: skill
    skill: pandas-3-guard
    description: Scan for removed pandas APIs and lost writes, then run the tests with ChainedAssignmentError as an error.
  - path: skills/pandas-3-guard/scripts/pandas3_guard.py
    role: reference
    skill: pandas-3-guard
    description: Read-only scanner for removed pandas APIs, chained writes and dtype checks.
  - path: skills/pandas-3-guard/references/rename-table.md
    role: reference
    skill: pandas-3-guard
    description: pandas 1 and 2 to pandas 3 table, including copy-on-write fixes.
  - path: skills/pandas-3-guard/references/pandas2-sample.py.txt
    role: reference
    skill: pandas-3-guard
    description: A pandas 2 cleaning script for checking the guard.
requires:
  tools:
    - python3
    - uv
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - pandas3_guard.py
  notes: The scanner only reads .py and .ipynb files and prints findings; it never edits files and makes no network calls. Running the project with uv may download the pinned packages.
