id: ios-mobilebuildmcp
type: loadout
title: iOS builds with MobileBuildMCP (XcodeBuildMCP)
summary: Let the agent build, test, run and screenshot iOS and macOS apps through MobileBuildMCP, pinned with telemetry off, with Swift concurrency and pbxproj rules.
description: |
  XcodeBuildMCP, now MobileBuildMCP from Sentry, is the MCP server iOS developers keep naming as a daily driver: it lets the agent discover schemes, build for a simulator, run tests, launch the app and look at the screen, instead of guessing xcodebuild flags. This loadout pins it with telemetry disabled and adds the rules for Swift work: build, test and look before reporting, main-actor UI, no force unwraps on outside data, Swift Testing for new tests, and hands off signing, entitlements, pbxproj and uploads.
highlights:
  - MobileBuildMCP pinned, telemetry off via MOBILEBUILDMCP_SENTRY_DISABLED
  - "Session defaults set once: project, scheme, simulator"
  - Done means built, tests run, launched and seen on screen
  - Swift concurrency rules; no unsafe escapes without a reason
  - No pbxproj reformatting, signing changes or uploads
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
