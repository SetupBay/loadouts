  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts: []
  notes: npx downloads mobilebuildmcp from npm at the pinned version. The server runs xcodebuild and simulator tools locally on macOS. Sentry error telemetry is disabled in the config.
