id: electron-playwright-e2e
type: loadout
title: Electron end-to-end tests with Playwright
summary: "Playwright tests that drive the real Electron app: secure webPreferences, no Node in the renderer, IPC round trips, input validation and blocked navigation."
description: |
  Renderer unit tests miss the Electron bugs that matter. A preload leaks ipcRenderer, a handler trusts its input, or someone sets sandbox: false to make a feature work. This loadout gives your agent Playwright's Electron support, set up properly. A fixture gives every test its own app instance and an empty userData folder, with a relaunch for persistence tests. An example suite asserts the secure webPreferences from the main process and checks that the renderer sees only the preload API. It drives an IPC feature through the UI and onto disk and back after a restart, checks the handler rejects bad input, and confirms that window.open and navigation are denied. A CI workflow runs it under xvfb on Ubuntu. The verifier runs the suite against a sandboxed Electron 44.9.0 app with @playwright/test 1.64.1. It also checks that turning the sandbox off or exposing ipcRenderer fails a test.
highlights:
  - Fresh app and userData per test, with relaunch for persistence
  - "Security assertions: sandbox, contextIsolation, no Node in the renderer"
  - IPC covered by end-to-end tests, including handler validation
  - Runs headless on Linux CI under xvfb-run
  - Verified on Electron 44.9.0 and @playwright/test 1.64.1
