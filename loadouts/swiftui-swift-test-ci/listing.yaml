id: swiftui-swift-test-ci
type: loadout
title: SwiftUI with a Swift package core and swift test in CI
summary: SwiftUI screens as thin views over @Observable view models in a Swift package, with Swift Testing tests run by swift test on Linux and macOS CI.
description: |
  Agents writing SwiftUI put the logic in body, where nothing can test it, and then claim the feature works because Xcode built. This loadout gives your agent a structure that tests can reach. Each screen's state, validation and side effects live in a main-actor @Observable view model inside a local Swift package. The network and clock come in through Sendable protocols, so tests swap in actor fakes. The SwiftUI view stays thin and sits behind canImport(SwiftUI), so the package builds and tests on Linux too. A cheap Linux CI job runs swift format lint and swift test in the Swift 6.4.1 container. A macOS job builds the views for the iOS simulator. The verifier runs the full example in the Swift 6 language mode on Swift 6.4.1: six tests and nine cases pass. It also checks that a swallowed error fails the tests and that a main-actor violation fails the build.
highlights:
  - "@MainActor @Observable view model with enum state and no SwiftUI import"
  - Injected Sendable client and clock; actor fakes in tests
  - Swift Testing with parameterised cases instead of XCTest copies
  - Linux CI runs swift test; macOS CI compiles the views for the simulator
  - Verified on Swift 6.4.1 in the Swift 6 language mode
