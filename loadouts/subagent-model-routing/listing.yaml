id: subagent-model-routing
type: loadout
title: Subagent model routing
summary: Rules for when to delegate, which model and effort each subagent gets, and a brief template, with ready subagents for Claude Code and Codex.
description: |
  Practitioners spent autumn 2026 writing down how their lead model should delegate: the lead plans and
  decides, cheaper tiers do bounded work, and every spawn sets model and effort on purpose. This loadout
  turns that into rules an agent can follow: a three-class routing table (mechanical, bounded, judgement),
  a tripwire for when to stop doing work inline, and a brief template, because subagents only know what
  the brief tells them. It ships three Claude Code subagents (read-only scout on Sonnet, command runner on
  Haiku, reviewer on Opus) and equivalent Codex agent TOML.
highlights:
  - Routing table by task class, with tier and effort for Claude Code and Codex
  - Brief template so subagents get the facts instead of rediscovering them
  - scout (read-only), runner (mechanical) and reviewer (never edits) subagents for Claude Code
  - Codex .codex/agents TOML examples with model and model_reasoning_effort
  - Tripwire rule for when the lead must stop and delegate
