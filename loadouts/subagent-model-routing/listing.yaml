    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .claude/agents/scout.md
    role: subagent
    description: Read-only exploration subagent on Sonnet.
  - path: .claude/agents/runner.md
    role: subagent
    description: Mechanical command runner on Haiku.
  - path: .claude/agents/reviewer.md
    role: subagent
    description: Adversarial reviewer on Opus that never edits.
  - path: skills/delegate-task/SKILL.md
    role: skill
    skill: delegate-task
    description: Classify, pick model and effort, and write the brief before spawning.
  - path: skills/delegate-task/references/codex-agents.md
    role: reference
    skill: delegate-task
    description: Codex custom agent TOML with model and reasoning effort.
