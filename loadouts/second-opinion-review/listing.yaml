    role: instructions
    description: When and how to get an independent review.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/cross-model-review/SKILL.md
    role: skill
    skill: cross-model-review
    description: Run a read-only review by another model and triage findings.
  - path: skills/cross-model-review/references/review-prompt.md
    role: reference
    skill: cross-model-review
    description: Reviewer prompt template.
requires:
