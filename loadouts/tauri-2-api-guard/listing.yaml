id: tauri-2-api-guard
type: loadout
title: Tauri 2 guard for Tauri 1 imports, config and Rust APIs
summary: Stop agents writing @tauri-apps/api/tauri, appWindow, the allowlist, get_window and emit_all into Tauri 2 apps, and catch the snake_case invoke arguments Tauri 2 rejects.
description: |
  Tauri 2 has been out since October 2024, but much of what agents learnt is Tauri 1. Tauri 2 moved invoke to @tauri-apps/api/core, replaced appWindow, split fs, dialog, shell and http into plugins, replaced the allowlist with capabilities, renamed tauri.conf.json keys (tauri to app, distDir to frontendDist, devPath to devUrl) and renamed core Rust APIs (get_window, emit_all, SystemTray, WindowBuilder). It also expects command arguments in camelCase from JavaScript, which catches out new Tauri 2 code too.

  This loadout pairs a Cursor rule and AGENTS.md (a never/always table covering the front end, the config and Rust) with a skill that checks the work. A standard-library Python scanner reports Tauri 1 code as errors across .ts/.js, .rs, tauri.conf.json, Cargo.toml and package.json. Then tsc checks the front end, a Node test mocks the IPC to pin the argument names, and the config is validated against the schema shipped in the Tauri CLI. The verifier runs all of this on a Tauri 2 notes app and a Tauri 1 sample, and checks the Rust names against the published tauri 2.12.5 crate source. For least-privilege capabilities, pair it with the Tauri 2 desktop app loadout.
highlights:
  - Never/always table for the front end, tauri.conf.json and Rust
  - Scanner flags Tauri 1 imports, config keys and Rust APIs as errors
  - Warns on snake_case invoke arguments, which Tauri 2 doesn't map
  - A Node test with @tauri-apps/api/mocks pins the camelCase argument names
  - Validates tauri.conf.json against the schema shipped in the Tauri CLI
