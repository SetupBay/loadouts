files:
  - path: AGENTS.md
    role: instructions
    description: Tauri 2 version facts, rules and the done checklist.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/tauri-2-only.mdc
    role: rules
    description: Never/always table for the front end, Rust and tauri.conf.json.
  - path: skills/tauri-2-guard/SKILL.md
    role: skill
    skill: tauri-2-guard
    description: Scan for Tauri 1 code, then type-check, test with mocked IPC and validate the config schema.
  - path: skills/tauri-2-guard/scripts/tauri2_guard.py
    role: reference
    skill: tauri-2-guard
    description: Read-only scanner for Tauri 1 imports, config keys, Rust APIs and snake_case invoke arguments.
  - path: skills/tauri-2-guard/references/v1-to-v2.md
    role: reference
    skill: tauri-2-guard
    description: Tauri 1 to Tauri 2 tables for the front end, the config and Rust.
  - path: skills/tauri-2-guard/references/tauri1-sample/main.ts.txt
    role: reference
    skill: tauri-2-guard
    description: Tauri 1 front end for checking the guard.
  - path: skills/tauri-2-guard/references/tauri1-sample/main.rs.txt
    role: reference
    skill: tauri-2-guard
    description: Tauri 1 main.rs for checking the guard.
  - path: skills/tauri-2-guard/references/tauri1-sample/tauri.conf.json.txt
    role: reference
    skill: tauri-2-guard
    description: Tauri 1 tauri.conf.json for checking the guard.
  - path: skills/tauri-2-guard/references/tauri1-sample/Cargo.toml.txt
    role: reference
    skill: tauri-2-guard
    description: Tauri 1 Cargo.toml for checking the guard.
requires:
  tools:
    - node
    - python3
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - tauri2_guard.py
  notes: The scanner only reads source, config and manifest files and prints findings; it never edits files and makes no network calls. Installing the project's pinned packages with npm, or running cargo, downloads them.
