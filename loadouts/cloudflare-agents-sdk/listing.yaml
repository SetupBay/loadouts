id: cloudflare-agents-sdk
type: loadout
title: Cloudflare Agents SDK, wired right before deploy
summary: "Stateful agents on Workers with the agents package (SQL, state, schedules, @callable) and a check that every Agent class is bound, on SQLite, with nodejs_compat."
description: |
  Cloudflare's Agents SDK turns a Durable Object into a long-lived agent: each named instance has its own SQLite database, state synced to clients over WebSockets, and alarms it can schedule for itself. It is quick to start and easy to wire wrongly. The class name in the binding has to match the export exactly, every Agent needs SQLite storage, the agents package needs nodejs_compat, and @callable() decorators need an ES2021 TypeScript target. A coding agent that gets one of these wrong finds out at deploy time, or later when state goes missing.

  This loadout gives agents a reference Agent (validated callable methods, bound SQL, an idempotent scheduled method, routeAgentRequest with a 404 fallback) and a wrangler.jsonc using the current exports form, written against agents 0.30.1. A read-only Node script checks the wiring before every deploy and says exactly what to fix, including bindings that point at renamed classes. Cloudflare's docs MCP server keeps the API current, and AGENTS.md keeps renames, storage changes and deploys behind the human's go-ahead.
highlights:
  - Reference Agent with SQL, synced state, a schedule and validated @callable methods
  - wrangler.jsonc with nodejs_compat and SQLite storage in the exports form
  - Wiring check for bindings, storage, flags and the ES2021 decorator target
  - Cloudflare docs MCP server for current APIs
  - Renames, storage changes and deploys need the human's go-ahead
