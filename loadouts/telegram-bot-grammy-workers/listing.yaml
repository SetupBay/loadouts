    role: instructions
    description: Rules for secrets, webhooks, error handling and deploys in a grammY Worker bot.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/grammy-worker-bot/SKILL.md
    role: skill
    skill: grammy-worker-bot
    description: Add commands, test them with a fake Bot API, and go live with the webhook secret.
  - path: skills/grammy-worker-bot/references/index.ts
    role: reference
    skill: grammy-worker-bot
    description: Reference Worker with secretToken, botInfo, an error boundary and a testable handle().
  - path: skills/grammy-worker-bot/references/wrangler.jsonc
    role: reference
    skill: grammy-worker-bot
    description: Wrangler config with BOT_INFO in vars and nothing secret.
  - path: skills/grammy-worker-bot/scripts/bot_check.mjs
    role: reference
    skill: grammy-worker-bot
    description: Node standard-library check for leaked tokens, open webhooks, polling and error handling.
  - path: skills/grammy-worker-bot/scripts/set_webhook.mjs
    role: reference
    skill: grammy-worker-bot
    description: Human-run setWebhook with secret_token and allowed_updates, then getWebhookInfo.
requires:
  tools:
    - node
    - npm
  env:
    - BOT_TOKEN
    - WEBHOOK_SECRET
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - bot_check.mjs
    - set_webhook.mjs
  notes: set_webhook.mjs calls the Telegram Bot API (setWebhook, getWebhookInfo) with the human's token from the environment and never prints it. bot_check.mjs only reads the project.
