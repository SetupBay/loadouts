id: telegram-bot-grammy-workers
type: loadout
title: Telegram bot with grammY on Cloudflare Workers
summary: "grammY 1.46 webhook bots on Workers: secret-token check, botInfo, error boundaries instead of bot.catch, Queues for slow work, and tests with a fake Bot API."
description: |
  grammY runs well on Cloudflare Workers, but the usual long-polling habits break there. `bot.start()` does nothing useful, `bot.catch()` doesn't cover webhooks, so one buggy handler makes Telegram resend the same update dozens of times, and the official quick start leaves the webhook open to anyone who finds the URL. Agents also like to put the bot token in `vars`.

  This loadout pins grammY 1.46.0 and ships a reference Worker. The webhook is checked with `secretToken`, the getMe result goes in a `BOT_INFO` var, handlers sit inside `bot.errorBoundary()`, and a `handle()` export lets tests drive real update JSON through the Worker with a fake Bot API, with no token and no network. bot_check.mjs (Node standard library) flags tokens in config or code, secrets in `vars`, a missing `.dev.vars` ignore, `bot.start()`, webhooks without a secret, a missing error boundary and `onTimeout: "return"`. set_webhook.mjs is for the human to run after a deploy. It sets the webhook with `secret_token` and `allowed_updates` and prints getWebhookInfo. It's the Workers counterpart to the telegram-bot-python loadout.
highlights:
  - grammY 1.46.0 with webhookCallback "cloudflare-mod" and secretToken (401 without it)
  - botInfo from a BOT_INFO var, so no getMe call per request
  - Handlers in bot.errorBoundary(); bot.catch only covers long polling
  - Slow work to a Queue inside grammY's 10-second webhook window
  - Tests post real update JSON through the Worker with a fake Bot API
  - bot_check.mjs flags leaked tokens, secrets in vars, polling and open webhooks
  - set_webhook.mjs sets secret_token and allowed_updates, then shows getWebhookInfo
