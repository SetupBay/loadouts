id: astro-starlight-docs
type: loadout
title: Starlight docs on Astro 7 with checked links
summary: "Agent rules for Starlight 0.42 docs sites on Astro 7: front matter that search and llms.txt can use, links the validator checks, and the 0.39 sidebar change."
description: |
  Starlight is Astro's documentation theme. Agents are good at writing docs pages and bad at the details that make a docs site hold together: they add a second h1, link to `../guides/setup.md`, invent `#anchors` that don't exist, skip the description, and copy sidebar config from old blog posts. Since Starlight 0.39 that old `{ label, autogenerate }` sidebar shape fails the build outright.

  This loadout pins Astro 7.4.4 and Starlight 0.42.7 and ships a reference `astro.config.mjs` with starlight-links-validator 0.27.0 (fails the build on broken internal links and fragments) and starlight-llms-txt 0.12.0 (writes /llms.txt so other agents can read the docs). The rules cover front matter, root-relative links, when to use MDX, image handling and upgrading Astro and Starlight together. docs_lint.mjs (Node standard library) catches what the build doesn't: missing descriptions, body h1s, `.md` links, absolute self-links and images without alt text. It's the docs-site companion to the astro-static-site loadout.
highlights:
  - Astro 7.4.4 and Starlight 0.42.7, upgraded together with npx @astrojs/upgrade
  - starlight-links-validator 0.27.0 fails the build on broken links and #fragments
  - starlight-llms-txt 0.12.0 publishes /llms.txt, llms-small.txt and llms-full.txt
  - Sidebar autogenerate in the post-0.39 items shape (the old shape fails the build)
  - Title is the h1, so pages start at ##; description on every page
  - docs_lint.mjs flags missing descriptions, .md links, self-links and missing alt text
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
  - title: "Starlight docs: authoring content in Markdown"
    url: https://starlight.astro.build/guides/authoring-content/
  - title: "Starlight docs: frontmatter reference"
    url: https://starlight.astro.build/reference/frontmatter/
  - title: "Starlight docs: sidebar navigation (autogenerated groups)"
    url: https://starlight.astro.build/guides/sidebar/
  - title: "Starlight changelog (0.39 sidebar change, 0.41 Astro 7, 0.42 minimums)"
    url: https://github.com/withastro/starlight/blob/main/packages/starlight/CHANGELOG.md
  - title: HiDeoo/starlight-links-validator
    url: https://github.com/HiDeoo/starlight-links-validator
  - title: delucis/starlight-llms-txt
    url: https://github.com/delucis/starlight-llms-txt
categories:
  - web-app
  - workflow
stacks:
  - astro
  - javascript
  - typescript
files:
  - path: AGENTS.md
    role: instructions
    description: Rules for pages, links, sidebar and upgrades in a Starlight site.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: skills/starlight-docs-page/SKILL.md
    role: skill
    skill: starlight-docs-page
    description: Add, move or rewrite a docs page and prove it with the lint and the build.
  - path: skills/starlight-docs-page/scripts/docs_lint.mjs
    role: reference
    skill: starlight-docs-page
    description: Node standard-library lint for front matter, headings, links and alt text.
  - path: skills/starlight-docs-page/references/astro.config.mjs
    role: reference
    skill: starlight-docs-page
    description: Reference config with the links validator, llms.txt and the 0.39+ sidebar shape.
requires:
  tools:
    - node
    - npm
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: false
  scripts:
    - docs_lint.mjs
  notes: docs_lint.mjs only reads files under the docs folder. Installing the Astro, Starlight and plugin packages from npm is left to the human's normal npm install.
last_checked: 2026-10-29
published: 2026-10-29
updated: 2026-10-29
