id: sqlalchemy-2-style-guard
type: loadout
title: SQLAlchemy 2 guard against 1.x and legacy Query code
summary: Stop agents writing engine.execute, select([...]), row["name"] and session.query into SQLAlchemy 2 projects, and catch writes that are never committed.
description: |
  SQLAlchemy 2.0 has been out since January 2023, but agents still write 1.x code: engine.execute("..."), plain SQL strings, select([...]), row["name"], MetaData(bind=), autocommit=True, and untyped Column models behind declarative_base(). The removed APIs fail at once. session.query() keeps running as the legacy Query API, so it spreads. The costly change is silent: 2.x has no autocommit, so an insert inside engine.connect() with no commit is rolled back when the block ends, and nothing reports it.

  This loadout pairs a short Cursor rule and AGENTS.md (a never/always table) with a skill that checks the work. A standard-library Python scanner reports removed 1.x APIs and legacy Query calls as errors, and untyped columns, backref, lazy="dynamic" and writes inside connect() as warnings. Then the tests run with SADeprecationWarning raised as an error and read every write back in a new session. The verifier runs both against a 2.0-style app on the pinned SQLAlchemy 2.1.6 and a 1.x sample, and shows SQLAlchemy refusing the sample's removed calls and rolling back its uncommitted write.
highlights:
  - Never/always table for 2.0-style SQLAlchemy in a .py-scoped Cursor rule
  - Scanner flags removed 1.x APIs and legacy session.query as errors
  - Warns on writes inside engine.connect() that are never committed
  - Typed Mapped models, back_populates and WriteOnlyMapped instead of legacy forms
  - Tests run with SADeprecationWarning as an error and read writes back
