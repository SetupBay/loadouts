  - title: "SQLAlchemy docs: ORM querying guide"
    url: https://docs.sqlalchemy.org/en/21/orm/queryguide/index.html
  - title: "SQLAlchemy docs: working with transactions and the DBAPI"
    url: https://docs.sqlalchemy.org/en/21/tutorial/dbapi_transactions.html
  - title: "SQLAlchemy 2.1.6 on PyPI (released 21 Oct 2026)"
    url: https://pypi.org/project/SQLAlchemy/2.1.6/
categories:
  - web-app
  - data
stacks:
  - sqlalchemy
  - python
  - pytest
files:
  - path: AGENTS.md
    role: instructions
    description: SQLAlchemy 2 version facts, rules and the done checklist.
  - path: CLAUDE.md
    role: adapter
    agent: claude-code
    description: Imports AGENTS.md for Claude Code.
  - path: GEMINI.md
    role: adapter
    agent: gemini-cli
    description: Imports AGENTS.md for Gemini CLI.
  - path: .cursor/rules/sqlalchemy-2-style.mdc
    role: rules
    description: Never/always table for Python files.
  - path: skills/sqlalchemy-2-guard/SKILL.md
    role: skill
    skill: sqlalchemy-2-guard
    description: Scan for 1.x and legacy SQLAlchemy code, then run the tests with deprecations as errors.
  - path: skills/sqlalchemy-2-guard/scripts/sqlalchemy2_guard.py
    role: reference
    skill: sqlalchemy-2-guard
    description: Read-only scanner for removed and legacy SQLAlchemy APIs and uncommitted writes.
  - path: skills/sqlalchemy-2-guard/references/migration-table.md
    role: reference
    skill: sqlalchemy-2-guard
    description: SQLAlchemy 1.x to 2.0 style table, including transactions.
  - path: skills/sqlalchemy-2-guard/references/sqlalchemy1-sample.py.txt
    role: reference
    skill: sqlalchemy-2-guard
    description: A SQLAlchemy 1.x module for checking the guard.
requires:
  tools:
    - python3
    - uv
  env: []
  mcp: []
security:
  scanned: true
  scanner: intake-precheck/2
  verdict: clean
  network: true
  scripts:
    - sqlalchemy2_guard.py
  notes: The scanner only reads .py files and prints findings; it never edits files and makes no network calls. Running the tests with uv may download the pinned packages.
