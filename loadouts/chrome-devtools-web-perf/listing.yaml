id: chrome-devtools-web-perf
type: loadout
title: Page speed with Chrome DevTools MCP, measured not guessed
summary: "Chrome DevTools MCP pinned with a throwaway profile and telemetry off, plus a trace, fix, re-trace loop that compares medians with Core Web Vitals thresholds."
description: |
  Chrome DevTools MCP is one of the most-shared agent setups this month: the agent opens your site in a real Chrome, reads console errors and network requests, and records performance traces. Two details often get lost when it is passed on. lighthouse_audit leaves out performance (it covers accessibility, SEO, best practices and agentic browsing), so speed has to come from a trace. And a single trace is noise, so "fixed, the score went up" after one run proves little.

  This loadout pins chrome-devtools-mcp 1.12.0 with --isolated (a temporary profile, not your signed-in one), --no-usage-statistics, and --no-performance-crux so local and staging URLs are not sent to Google's CrUX API. The skill sets mobile throttling once, records three cold-load traces, reads the biggest insight (LCP breakdown, render-blocking requests, document latency), changes one thing, and measures again. A small Node script logs each trace and compares medians with a noise margin against the good thresholds (LCP 2.5 s, INP 200 ms, CLS 0.1). It fails on any regression.
highlights:
  - chrome-devtools-mcp 1.12.0 pinned; temporary profile, no telemetry, no CrUX lookups
  - "Speed from traces: lighthouse_audit excludes performance"
  - Same throttling every run, three traces per state, medians compared
  - perf_log.mjs fails on regressions past a noise margin or lost "good" thresholds
  - One change per measurement; no improvement means revert
