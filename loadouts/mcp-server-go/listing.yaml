id: mcp-server-go
type: loadout
title: MCP server in Go (official go-sdk)
summary: "Build MCP servers in Go with the official go-sdk: typed tools with jsonschema tags, tool errors not panics, stdout kept for the protocol, in-memory client tests."
description: |
  The official Go SDK for the Model Context Protocol reached v1.8 in September 2026 and generates each tool's input schema from a Go struct. That makes the struct tags the documentation the model reads, and it makes a careless fmt.Println on stdout a protocol error. This loadout gives your agent the rules for a Go MCP server (stdout hygiene, typed tools, validation, read-only by default, untrusted tool output) and a skill for adding tools with an in-memory client test. The verifier builds the example on go-sdk v1.8.0, runs the tests under the race detector and talks raw JSON-RPC to the binary over stdio.
highlights:
  - Official github.com/modelcontextprotocol/go-sdk, pinned at v1.8.0
  - Typed input and output structs; jsonschema tags become the schema
  - Errors returned as isError tool results, never panics
  - Logs on stderr only; the verifier checks stdout is pure JSON-RPC
  - Every tool has a test that calls it through a real client over in-memory transports
