id: mcp-server-python
type: loadout
title: MCP server in Python (official SDK v2)
summary: "Build MCP servers on the official Python SDK v2: MCPServer, Annotated schemas, structured output, ToolError for fixable failures and in-memory Client tests."
description: |
  Version 2 of the official MCP Python SDK renamed FastMCP to MCPServer, moved its modules and added a first-class Client that tests a server in memory. Agents trained on v1 still write from mcp.server.fastmcp import FastMCP, which no longer imports. This loadout pins the v2 API in your agent's rules: typed tools with Annotated descriptions and limits, Pydantic return types for structured output, ToolError for failures the model can fix, and nothing on stdout. A skill adds tools with in-memory Client tests. The verifier runs the tests on mcp 2.3.0, runs ruff and talks raw JSON-RPC to the server over stdio.
highlights:
  - "Official mcp 2.3.0: MCPServer, not the removed FastMCP import"
  - Annotated Field descriptions and limits become the input schema
  - ToolError for recoverable failures; other exceptions never leak internals
  - In-memory Client tests, no subprocess or port
  - Verifier checks stdout is pure JSON-RPC and logs go to stderr
