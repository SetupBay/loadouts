id: django-rest-api
type: loadout
title: Django REST Framework API rules
summary: "DRF rules for agents: explicit serializer fields, querysets scoped to the user, owner set on the server, pagination, and six tests for every endpoint."
description: |
  The DRF code agents write usually works for the person testing it and leaks for everyone else: fields set to __all__, a queryset of every row with a permission check bolted on, an owner field accepted from the request body, an unpaginated list that runs a query per row. This loadout gives your agent the DRF conventions that prevent that, from the official docs and the OWASP API Security Top 10's broken object level authorisation. A skill adds endpoints with the six tests each one needs. The verifier runs the tests on Django 6.1 and DRF 3.18, and checks that the query-count test fails without select_related.
highlights:
  - IsAuthenticated by default; AllowAny only when asked
  - "get_queryset scoped to request.user: other users' rows are a 404"
  - Owner set in perform_create, never from the request body
  - Explicit serializer fields; no __all__ or exclude
  - Six tests per endpoint, including a flat query count
