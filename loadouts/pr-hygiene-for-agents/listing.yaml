id: pr-hygiene-for-agents
type: loadout
title: PR hygiene for agents
summary: "Commit and PR rules for coding agents: small PRs, a four-part body, screenshots with gh --attach and a leak check for session links and secrets before pushing."
description: |
  Agent-written pull requests fail review for boring reasons: too big, no test evidence, no screenshots, and sometimes a
  private session link or local path in a public commit. This loadout sets commit and PR rules an agent can follow, a
  pre-push leak check, and a gh-based procedure that uses the --attach flag added in GitHub CLI 2.99 for screenshots.
  It respects each repository's own AI-disclosure policy rather than hiding attribution.
highlights:
  - Commit and PR size rules, with a What / Why / How tested / Notes body
  - Screenshots attached with gh pr create --attach and alt text (gh 2.99+)
  - Pre-push leak check for session URLs, local paths and secret-looking lines
  - Claude Code attribution.sessionUrl setting for cloud and Remote Control sessions
  - Draft first, ready when checks are green
version: 1.0.0
license: MIT
author:
  name: SetupBay
credits:
  - title: "@cwage: private session URLs in public PRs"
    url: https://x.com/cwage/status/2099570173829087479
  - title: "@neil_jhaveri: AGENTS.md rule to attach UI screenshots with gh"
    url: https://x.com/neil_jhaveri/status/2108061424215789751
  - title: GitHub CLI 2.99.0 release notes
    url: https://github.com/cli/cli/releases/tag/v2.99.0
  - title: "Claude Code settings: attribution"
