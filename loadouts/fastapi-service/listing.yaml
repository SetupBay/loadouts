id: fastapi-service
type: loadout
title: FastAPI service rules
summary: "Rules and an endpoint skill for FastAPI with uv and Pydantic v2: Annotated dependencies, typed responses, async only when awaited, lifespan, routes with tests."
description: |
  FastAPI is one of the stacks agents write most often, and the same mistakes keep turning up in their output: blocking calls inside async routes, ORM objects returned unvalidated, Pydantic v1 syntax, on_event hooks, wildcard CORS with credentials. This loadout pins the current conventions from the FastAPI docs (Annotated dependencies, return-type response models, lifespan, dependency overrides in tests) and gives the agent an endpoint skill with an example router and tests that the verifier runs.
highlights:
  - "uv for everything: uv add, uv run fastapi dev, uv run pytest"
  - Annotated[..., Depends()] aliases and dependency_overrides in tests
  - async def only when everything inside is awaited
  - Typed response models; 201, 404 and 422 handled properly
  - Example router and tests checked by the verifier
